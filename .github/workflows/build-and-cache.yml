name: Build and Cache Hosts

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - cloudburst-desktop
          - cloudburst-laptop
          - cloudburst-tablet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout nixcache-oci tools
        uses: actions/checkout@v4
        with:
          repository: cmspam/nixcache-oci
          path: ${{ runner.temp }}/nixcache-oci

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup signing key
        run: |
          if [[ -n "${{ secrets.NIX_SIGNING_KEY }}" ]]; then
            echo "${{ secrets.NIX_SIGNING_KEY }}" > "$RUNNER_TEMP/signing-key"
            echo "NIXCACHE_SIGNING_KEY_FILE=$RUNNER_TEMP/signing-key" >> "$GITHUB_ENV"
            nix key convert-secret-to-public < "$RUNNER_TEMP/signing-key" > "$RUNNER_TEMP/signing-key.pub" 2>/dev/null || true
            echo ">>> Signing key configured"
            if [[ -f "$RUNNER_TEMP/signing-key.pub" ]]; then
              echo ">>> Public key: $(cat "$RUNNER_TEMP/signing-key.pub")"
            fi
          else
            echo ">>> No signing key configured — cache will be unsigned"
            echo "::notice::Cache packages will not be signed. Set NIX_SIGNING_KEY secret to enable signing."
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build host and publish cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIXCACHE_CONFIG_DIR: "."
        run: |
          # Lowercase repo name for OCI registry compliance
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          export NIXCACHE_REPO="$REPO"
          export NIXCACHE_IMAGE="ghcr.io/${NIXCACHE_REPO}/nix-cache"

          # Source nixcache-oci builder logic
          source "${{ runner.temp }}/nixcache-oci/lib/cache-builder.sh"

          # Target only the current matrix host
          discover_outputs() {
            echo ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
          }

          # Refresh index immediately before merging to handle concurrent matrix job completions
          _orig_update_cache_index=$(declare -f update_cache_index | tail -n +2)
          update_cache_index() {
            local existing_index_file="$1"
            local receipts_file="$2"
            shift 2
            local gc_root_paths=("$@")

            local existing_manifest
            existing_manifest=$(oci_get_manifest "cache-index" 2>/dev/null || true)
            if [[ -n "$existing_manifest" ]]; then
              local index_digest
              index_digest=$(echo "$existing_manifest" | jq -r '.layers[0].digest // empty' 2>/dev/null)
              if [[ -n "$index_digest" ]]; then
                oci_get_blob "$index_digest" > "$existing_index_file" 2>/dev/null || echo '{}' > "$existing_index_file"
              fi
            fi

            eval "_call_orig_update_cache_index() $_orig_update_cache_index"
            _call_orig_update_cache_index "$existing_index_file" "$receipts_file" "${gc_root_paths[@]}"
          }

          full_pipeline
