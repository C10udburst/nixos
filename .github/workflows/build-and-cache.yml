name: Build and Cache Hosts

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-cache:
    name: Build and Cache Hosts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          listen: 127.0.0.1:37516

      - name: Setup signing key
        run: |
          if [[ -n "${{ secrets.NIX_SIGNING_KEY }}" ]]; then
            echo "${{ secrets.NIX_SIGNING_KEY }}" > "$RUNNER_TEMP/signing-key"
            echo "NIXCACHE_SIGNING_KEY_FILE=$RUNNER_TEMP/signing-key" >> "$GITHUB_ENV"
            nix key convert-secret-to-public < "$RUNNER_TEMP/signing-key" > "$RUNNER_TEMP/signing-key.pub" 2>/dev/null || true
            echo ">>> Signing key configured"
            if [[ -f "$RUNNER_TEMP/signing-key.pub" ]]; then
              echo ">>> Public key: $(cat "$RUNNER_TEMP/signing-key.pub")"
            fi
          else
            echo ">>> No signing key configured — cache will be unsigned"
            echo "::notice::Cache packages will not be signed. Set NIX_SIGNING_KEY secret to enable signing."
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build hosts and publish cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIXCACHE_CONFIG_DIR: "."
        run: |
          # Lowercase repo name for OCI registry compliance
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          export NIXCACHE_REPO="$REPO"
          export NIXCACHE_IMAGE="ghcr.io/${NIXCACHE_REPO}/nix-cache"

          # Resolve nixcache-oci source directly from locked flake inputs
          NIXCACHE_SRC=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixcache-oci.outPath')
          source "${NIXCACHE_SRC}/lib/cache-builder.sh"

          # Target all 3 hosts together
          discover_outputs() {
            echo ".#nixosConfigurations.cloudburst-desktop.config.system.build.toplevel"
            echo ".#nixosConfigurations.cloudburst-laptop.config.system.build.toplevel"
            echo ".#nixosConfigurations.cloudburst-tablet.config.system.build.toplevel"
          }

          full_pipeline
