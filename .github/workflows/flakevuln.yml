name: Scan for Vulnerabilities in Nix Flake Cache

on:
  workflow_run:
    workflows: ["Build and Cache Hosts"]
    types: [completed]

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: flakevuln
  cancel-in-progress: false

jobs:
  flakevuln:
    name: Scan for Vulnerabilities in Nix Flake Cache
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # master
        with:
          swap-size-gb: 10

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            max-jobs = 1
            cores = 2

      - name: Setup access for private dependencies
        run: |
          if [[ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]]; then
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            sudo mkdir -p /root/.ssh
            sudo cp ~/.ssh/known_hosts /root/.ssh/known_hosts
            echo "${{ secrets.SSH_PRIVATE_KEY }}" | sudo tee /root/.ssh/id_ed25519 >/dev/null
            sudo chmod 600 /root/.ssh/id_ed25519
            echo -e "Host github.com\n  IdentityFile /root/.ssh/id_ed25519\n  StrictHostKeyChecking accept-new" | sudo tee -a /etc/ssh/ssh_config >/dev/null || true
            echo -e "Host github.com\n  IdentityFile ~/.ssh/id_ed25519\n  StrictHostKeyChecking accept-new" >> ~/.ssh/config
            eval $(ssh-agent -s)
            ssh-add ~/.ssh/id_ed25519
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          fi
          if [[ -n "${{ secrets.GH_PAT }}" ]]; then
            sudo git config --system url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "ssh://git@github.com/"
            sudo git config --system --add url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
            git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "ssh://git@github.com/"
            git config --global --add url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
            echo "extra-access-tokens = github.com=${{ secrets.GH_PAT }}" | sudo tee -a /etc/nix/nix.conf >/dev/null
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run vulnerability scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          export NIXCACHE_REPO="$REPO"
          export NIXCACHE_IMAGE="ghcr.io/${NIXCACHE_REPO}/nix-cache"

          # Resolve nixcache-oci source directly from locked flake inputs
          NIXCACHE_SRC=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixcache-oci.outPath')
          source "${NIXCACHE_SRC}/lib/cache-builder.sh"

          start_self_substituter

          # Run vulnerability scan
          nix run --max-jobs 1 --cores 2 github:tiiuae/flakevuln#flakevuln -- \
            local \
            --nixtracker \
            --nixprs \
            nixosConfigurations.cache.config.system.build.toplevel

          stop_self_substituter

      - name: Generete SARIF report
        run: |
          python3 .github/sarif.py .flakevuln/findings.json
      - name: Set github action markdown to the raport
        run: |
          echo ">>> Setting markdown report"
          REPORT_FILE=".flakevuln/report/nixosConfigurations.cache.config.system.build.toplevel.md"
          if [[ -f "$REPORT_FILE" ]]; then
            echo ">>> Report file found: $REPORT_FILE"
            echo ">>> Setting report as output"
            echo "report<<EOF" >> "$GITHUB_OUTPUT"
            cat "$REPORT_FILE" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo ">>> Report file not found: $REPORT_FILE"
          fi
      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flakevuln-report
          path: .flakevuln/*
      - name: Upload SARIF artifact
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: .flakevuln/findings.sarif
          category: vulnxscan
