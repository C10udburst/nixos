# omp (can1357/oh-my-pi) custom providers — the local LLM gateway mirror of
# ../pi/_models.json. LiteLLM's free-model catalog is NOT listed here; omp's
# native picker browses it live via LITELLM_BASE_URL.
providers:
  llm:
    baseUrl: http://llm:8080/v1
    api: openai-completions
    # Gateway is unauthenticated; `auth: none` waives the apiKey requirement.
    auth: none
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: true
    models:
